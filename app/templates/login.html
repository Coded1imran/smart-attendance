<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AttendAI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      padding: 24px;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .role-toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-btn {
      padding: 10px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .role-btn.active {
      border-color: #4f46e5;
      background: #eef2ff;
      color: #4f46e5;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="/" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; margin-bottom:20px;">
      <div class="brand-icon">A</div>
      <span style="font-weight:800; font-size:1.3rem; color:#0f172a;">AttendAI</span>
    </a>

    <h2 style="font-size:1.5rem; font-weight:800; color:#0f172a; margin-bottom:6px;">Welcome Back</h2>
    <p style="font-size:0.9rem; color:#64748b; margin-bottom:28px;">Login to your account</p>

    <form id="login-form">
      <div class="form-group" style="text-align:left;">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group" style="text-align:left;">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <div style="text-align:left; margin-bottom:8px;">
        <label class="form-label">Login as</label>
      </div>
      <div class="role-toggle-group">
        <button type="button" id="role-student" class="role-btn active" onclick="selectRole('student')">
          <span>🎓</span> Student
        </button>
        <button type="button" id="role-lecturer" class="role-btn" onclick="selectRole('lecturer')">
          <span>👨‍🏫</span> Lecturer
        </button>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="padding:12px; margin-bottom:16px;">
        Login
      </button>

      <div style="margin-top:16px; font-size:0.85rem; color:#64748b;">
        Don't have an account? <br>
        <a href="/register/student" style="color:#4f46e5; font-weight:600; text-decoration:none;">Register as Student</a>
        &bull;
        <a href="/register/lecturer" style="color:#4f46e5; font-weight:600; text-decoration:none;">Register as Lecturer</a>
      </div>
    </form>
  </div>

  <script src="/static/js/attendance.js"></script>
  <script>
    let selectedRole = "student";

    function selectRole(role) {
      selectedRole = role;
      document.getElementById("role-student").classList.toggle("active", role === "student");
      document.getElementById("role-lecturer").classList.toggle("active", role === "lecturer");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            role: selectedRole
          })
        });

        const data = await res.json();
        if (res.ok) {
          showNotification(data.message || "Login successful!", "success");
          window.location.href = data.redirect_url;
        } else {
          showNotification(data.detail || "Login failed.", "error");
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (err) {
        showNotification("Network error. Please try again.", "error");
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
